<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Requests</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
  header { background: #0b3d5c; color: #fff; padding: .6rem 1rem; }
  header h1 { margin: 0; font-size: 1.2rem; }
  main { max-width: 820px; margin: 1rem auto; padding: 0 1rem; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .5rem; margin-bottom: 1rem; }
  input, button { padding: .4rem; font-size: 1rem; }
  button { background: #0b3d5c; color: #fff; border: 0; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  td, th { border: 1px solid #ccc; padding: .3rem .5rem; text-align: left; }
</style>
</head>
<body>
<header><h1>Purchase Requests</h1></header>
<main>
  <form id="f">
    <input id="who" placeholder="Your name" required>
    <input id="code" placeholder="Item code" required>
    <input id="qty" type="number" min="1" value="1" required>
    <input id="job" placeholder="For job">
    <input id="cost" type="number" step="0.01" min="0" placeholder="Est. cost each">
    <button>Raise request</button>
  </form>
  <table>
    <thead><tr><th>Date</th><th>By</th><th>Item code</th><th>Qty</th><th>Job</th><th>Est. total</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  const seed = [
    { date: '2026-10-12', who: 'Jo', code: 'AL-5083-5', qty: 4, job: 'J-1042', cost: 518 },
    { date: '2026-10-13', who: 'Mere', code: 'AL50835', qty: 2, job: '1040', cost: 518 },
    { date: '2026-10-14', who: 'Sam', code: 'nav lights red/green', qty: 1, job: 'J-1041', cost: 129 },
    { date: '2026-10-15', who: 'Jo', code: 'SS BOLT M8', qty: 3, job: 'J-1043', cost: 38.4 },
  ];
  let prs = JSON.parse(localStorage.getItem('pr') || 'null') || seed;

  function fmtMoney(n) {
    return '$' + Math.round(n);
  }

  function draw() {
    document.getElementById('rows').innerHTML = prs.map((p, i) =>
      `<tr><td>${p.date}</td><td>${p.who}</td><td>${p.code}</td><td>${p.qty}</td><td>${p.job}</td><td>${fmtMoney(p.qty * p.cost)}</td><td><button type="button" onclick="del(${i})">x</button></td></tr>`).join('');
  }
  function del(i) {
    prs.splice(i, 1);
    localStorage.setItem('pr', JSON.stringify(prs));
    draw();
  }
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value;
    prs.push({ date: new Date().toISOString().slice(0, 10), who: v('who'), code: v('code'), qty: +v('qty'), job: v('job'), cost: +v('cost') || 0 });
    localStorage.setItem('pr', JSON.stringify(prs));
    e.target.reset();
    draw();
  };
  draw();
</script>
</body>
</html>
