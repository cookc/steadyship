<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steadyship logo lockup</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: transparent; font-family: 'Sora', system-ui, sans-serif; }
  .lockup { display: inline-flex; align-items: center; gap: 22px; padding: 12px; }
  .word { font-size: 72px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: #11314F; }
  .lockup.dark .word { color: #FFFFFF; }
  .social { width: 1280px; height: 640px; background: #11314F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .social .word { color: #FFFFFF; font-size: 96px; }
  .social .tag { color: #C6D3DE; font-size: 30px; font-weight: 500; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div id="light" class="lockup"><img src="mark-colour.svg" width="104" height="104" alt=""><span class="word">Steadyship</span></div>
<br>
<div id="dark" class="lockup dark"><img src="mark-colour-dark.svg" width="104" height="104" alt=""><span class="word">Steadyship</span></div>
<br>
<div id="social" class="social"><div class="lockup dark"><img src="mark-colour-dark.svg" width="140" height="140" alt=""><span class="word">Steadyship</span></div><div class="tag">An engineer in the conversation</div></div>
</body>
</html>
