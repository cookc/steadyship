schema_version: "1.1"
name: h1-assess
description: >
  "Understand my system" on Harakeke Electrical (third business, HELD OUT;
  fixture tests/judgement/fixtures/harakeke-electrical, see FIXTURE). The
  fixture, its answer key and these graders were written without reading the
  Steadyship skills; the graders are frozen as written (do not widen them
  after seeing model output). One regex grader per answer-key row (fixture
  answer-key.md sections 2 and 3: c1-c7, d01-d22); pass >= 24/29, the same
  bar as s1-assess and r1-assess.
tags: [judgement, assess, harakeke, held-out]
context:
  scaffold_script: scaffold.sh   # copied in from tests/judgement/scaffold.sh by run.sh
execution:
  model: sonnet
  max_turns: 50
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
runs: 1
graders:
  # Guard: the agent must not read the staged cases (they spell out the answers).
  - {type: tool_used, name: no-peek, tool: Read, input_match: '/evals/|answer-key', min: 0, max: 0}
  # --- Section 2: shared concepts (7) ---
  # c1: the cafe is in the customer list twice (both ids, or the name plus "twice/duplicate/two records")
  - {type: regex, name: row-c1-customer-duplicate, flags: i, pattern: '^(?=[\s\S]*C-118)(?=[\s\S]*C-131)|Jetty Road[^\n]{0,300}(twice|two (separate |different )?(records|entries|rows|customers|spellings|names|ids|versions|lines)|duplicat|same (customer|caf[eé]|business|address|place)|listed under|second (record|entry|row)|both (spellings|names|records|entries))|(duplicat|twice|two (separate |different )?(records|entries|rows|spellings|customer records))[^\n]{0,300}Jetty Road'}
  # c2: the timesheet carries its own typed-in job list (or the reply counts the places the job list lives)
  - {type: regex, name: row-c2-timesheet-own-job-list, flags: i, pattern: '(timesheet|time sheet)[^\n]{0,250}(own (copy|list|set)|hard-?coded|typed[- ]in|built[- ]in|fixed list|short list|\b(6|six) (jobs|job numbers|of the)|only (has |lists |knows |offers |shows )?(6|six)\b)|(job list|list of jobs|job numbers?)[^\n]{0,160}(cop(y|ied|ies)|hard-?coded|typed)[^\n]{0,200}(timesheet|time sheet)|(job list|list of jobs)[^\n]{0,200}\b(three|four|3|4) (separate |different )?(places|copies|lists|versions)|\b(three|four|3|4) (separate |different )?(places|copies|lists|versions)[^\n]{0,200}(job list|list of jobs)'}
  # c3: both rates, with 92 tied to labour / the hour / the quote
  - {type: regex, name: row-c3-labour-rate-two-values, flags: i, pattern: '^(?=[\s\S]*\b98\b)(?=[\s\S]*(\$?92(\.00)?[^\n]{0,40}(an |per |/ ?|each )(h\b|hr|hour)|(labou?r|rate|hourly|quote)[^\n]{0,120}\b92\b|\b92\b[^\n]{0,120}(labou?r|rate|hourly|quote)))'}
  # c4: quote and invoice work out the materials price differently (0.8 / 25% / margin vs 1.2 / 20% / markup, or 600 vs 576)
  - {type: regex, name: row-c4-markup-two-sums, flags: i, pattern: '^(?=[\s\S]*materials?)(?=[\s\S]*(?:(0\.8\b|0\.80\b|25 ?(%|per ?cent)|margin|\b600(\.00)?\b)[^\n]{0,300}(1\.2\b|1\.20\b|20 ?(%|per ?cent)|mark-?up|\b576(\.00)?\b)|(1\.2\b|1\.20\b|20 ?(%|per ?cent)|mark-?up|\b576(\.00)?\b)[^\n]{0,300}(0\.8\b|0\.80\b|25 ?(%|per ?cent)|margin|\b600(\.00)?\b)))'}
  # c5: the call-out fee gets GST added although $115 already includes it
  - {type: regex, name: row-c5-callout-gst-twice, flags: i, pattern: 'call-?out[^\n]{0,300}(132\.25|17\.25|twice|again|double|on top|over-?charg|too much|as (if|though)[^\n]{0,40}(ex|before|without|plus)|treat(s|ed|ing)?[^\n]{0,60}(ex|before|excl|without|pre-?GST)|adds?[^\n]{0,40}(GST|15 ?%)|GST[^\n]{0,40}added|plus GST|\+ ?GST|GST on GST)|(132\.25|17\.25|GST (twice|on GST)|double[- ]?GST)[^\n]{0,300}call-?out'}
  # c6: cable counted in metres but treated as rolls (or the absurd stock value)
  - {type: regex, name: row-c6-cable-metres-vs-rolls, flags: i, pattern: '^(?=[\s\S]*(cable|TPS))(?=[\s\S]*(?:\b(rolls?|drums?|reels?)\b[^\n]{0,300}(\bmetres?\b|\bmeters?\b|\d ?m\b|per m\b|\bin m\b)|(\bmetres?\b|\bmeters?\b|\d ?m\b|per m\b)[^\n]{0,300}\b(rolls?|drums?|reels?)\b))|18,?720|150,?272'}
  # c7: status changes on the board stay in one browser / never reach the spreadsheet
  - {type: regex, name: row-c7-board-status-never-reaches-csv, flags: i, pattern: '^(?=[\s\S]*job[- ]?board)(?=[\s\S]*(?:(status(es)?|mov(e|es|ed)|changes?|updates?)[^\n]{0,160}(only|saved|stored|kept|live|stay)[^\n]{0,100}(browser|device|machine|computer|screen|phone|tablet|TV|local ?storage)|(never|don.t|doesn.t|does not|do not|won.t|not|nothing|none)[^\n]{0,80}(update|reach|change|sync|written back|write back|flow|feed|go back|get back|make it|saved)[^\n]{0,120}(spreadsheet|jobs(\.csv)?|csv|master)))'}
  # --- Section 3: planted duplications and defects (22) ---
  - {type: regex, name: row-d01-board-stale-statuses, flags: i, pattern: '^(?=[\s\S]*HE-4129[^\n]{0,200}(Booked|In progress))(?=[\s\S]*HE-4133[^\n]{0,200}(In progress|Waiting))'}
  - {type: regex, name: row-d02-board-missing-jobs, flags: i, pattern: 'HE-4138[^\n]{0,200}(missing|not (on|in|shown|there|listed|yet)|absent|left off|aren.t|isn.t|doesn.t|don.t|never|no sign)|(missing|not (on|in)|absent|left off|lacks|without|doesn.t (have|show|include|list)|only (has |shows |lists )?(14|fourteen)|\b(14|fourteen) of (the )?(16|sixteen))[^\n]{0,200}HE-4138'}
  - {type: regex, name: row-d03-duplicate-job-number, flags: i, pattern: 'HE-4131[^\n]{0,300}(twice|two (different |separate |unrelated )?(jobs|rows|entries|customers|lines|things)|duplicat|used (for|by|on) (two|2|both)|same (job )?number|shared|appears? (two|2) times|re-?used|given to (two|2|both)|both)|(duplicat|twice|same (job )?number|two (different |separate )?jobs|re-?used)[^\n]{0,300}HE-4131'}
  - {type: regex, name: row-d04-conflicted-copy, flags: i, pattern: 'conflict(ed)?[^\n]{0,400}(Tanner|sensor|HE-4137|only (in|there|exists)|not in (the )?(main|master|real|Jobs)|missing from|differ|disagree|diverg|which (one|file|is)|two (versions|copies|files)|second (copy|version|file)|out of (step|sync|date)|another (copy|version)|stray|left ?over)|(Tanner|sensor light|second (copy|version|file)|two (versions|copies|files)|another copy)[^\n]{0,400}conflict'}
  - {type: regex, name: row-d05-today-hard-coded, flags: i, pattern: '2026-11-02|\b2(nd)? (of )?Nov(ember)?\b|\bNov(ember)? 2(nd)?\b(?!\d)|(overdue|\btoday\b|today.s)[^\n]{0,200}(hard-?coded|fixed (date|day|value|at|to|on)|frozen|stuck|typed in|baked|never (changes|moves|updates)|for testing|test(ing)? (date|value)|left (in|over)|wired[- ]in|doesn.t (change|move|update))|(hard-?coded|frozen|stuck|baked|fixed|wired[- ]in)[^\n]{0,200}(\btoday\b|overdue)'}
  - {type: regex, name: row-d06-export-commas, flags: i, pattern: '^(?=[\s\S]*(export|CSV|copy[- ]out|paste))(?=[\s\S]*(?:\bcommas?\b[^\n]{0,300}(address|quot|column|split|shift|break|broke|field|escap)|(address|quot|column|escap|field)[^\n]{0,300}\bcommas?\b))'}
  - {type: regex, name: row-d07-access-codes-on-show, flags: i, pattern: '\b(alarm|key ?safe|lock ?box|gate|access|entry|security|door)[ -]?(codes?|details|notes|pins?|numbers?|info(rmation)?)\b[^\n]{0,400}(everyone|anyone|anybody|visible|on (the )?(screen|TV|board|cards?|display|wall)|shown|show(s|ing)?|display|expos|in (plain|full) (view|sight|text)|front office|public|visitor|phones?|sensitive|private|confidential|secur|risk|shouldn.t|should not)|\b(4471|2580|1962|7306)\b'}
  - {type: regex, name: row-d08-phone-leading-zero, flags: i, pattern: '275550161|35550148|(phones?|mobiles?|numbers?)[^\n]{0,200}(leading|first|initial|front|starting) (zero|0)|(leading|first|initial|starting) (zero|0)s?[^\n]{0,200}(phones?|mobiles?|numbers?)|(C-109|C-122|Marsh|Pokororo)[^\n]{0,200}(phone|number)[^\n]{0,120}(zero|\b0\b|digit|short|malformed|wrong|invalid|broken|missing|format)|(phones?|mobiles?)[^\n]{0,160}(lost|missing|dropped|stripped|without|no)[^\n]{0,40}(zero|\b0\b)'}
  - {type: regex, name: row-d09-discount-after-gst, flags: i, pattern: 'discount[^\n]{0,400}(after (the )?GST|GST[^\n]{0,80}(before|first|full|undiscounted|pre-?discount|too (high|much)|overstat|not reduced|wrong|higher|whole)|357\.90|\b5\.19\b|46\.68|311\.22|wrong (order|way round|place)|over-?charg|over-?pa(y|id))|(INV-1184|\b1184\b)[^\n]{0,400}(discount|GST|over-?charg|\b5\.19\b|357\.90)|(after (the )?GST|GST (is |gets |was )?(worked out|calculated|added|applied|charged) (first|before|on the (full|whole)))[^\n]{0,200}discount'}
  - {type: regex, name: row-d10-duplicate-invoice-number, flags: i, pattern: 'INV-1187[^\n]{0,300}(twice|two|duplicat|both|same|shared|re-?used|different customers)|(duplicat|same|two|clash|collid|repeat|re-?us)[^\n]{0,200}(invoice numbers?|INV-1187)|invoice numbers?[^\n]{0,250}(duplicat|clash|collid|repeat|re-?us|same number|twice|overlap|per (browser|computer|device|machine|PC)|each (browser|computer|device|machine|PC)|(count|number)(s|ed|ing|er)?[^\n]{0,80}(browser|computer|device|machine|laptop|its own|their own))'}
  - {type: regex, name: row-d11-invoiced-without-coc, flags: i, pattern: '(CoC|certificates? of compliance|compliance cert)[^\n]{0,300}(HE-4126|Tanner|no (check|field|mention|way|place)|not check|doesn.t (check|ask|know|record|look|stop|enforce)|never (checks|asks)|nothing (checks|stops|enforces)|without (a |one|the |any)|blank|missing|empty|no (CoC|certificate)|not enforced|ignor)|(HE-4126|Tanner)[^\n]{0,300}(CoC|certificate)|invoic[^\n]{0,200}(without|with no|no|missing|blank|lacking)[^\n]{0,40}(CoC|certificate)'}
  - {type: regex, name: row-d12-q0352-wrong-when-written, flags: i, pattern: '(Q-0352|\b0352\b|Hollis quote)[\s\S]{0,300}(\b92\b|stale|old (labour |hourly )?rate|under-?quot|\b84\b|1,?372|too low|under-?pric|out of date|\b600\b|\b576\b)|(\b92\b|under-?quot|\b84\b)[^\n]{0,300}(Q-0352|\b0352\b)'}
  - {type: regex, name: row-d13-hours-colon-misread, flags: i, pattern: '7:30[^\n]{0,300}(\b7\b|seven|half|30 min|drop|los[est]|ignor|truncat|parseFloat|short|under|wrong|mis-?read|cut|not (understood|handled|read))|(colon|h:mm|hh:mm|hours?:min(ute)?s?|parseFloat)[^\n]{0,300}(drop|los[est]|ignor|truncat|minutes|short|under|wrong|whole hours?|silently|zero)|(minutes|half[- ]hours?)[^\n]{0,80}(dropped|lost|ignored|thrown away|cut off|discarded)'}
  - {type: regex, name: row-d14-week-leaves-out-sunday, flags: i, pattern: 'Sundays?[^\n]{0,300}(exclu|miss|left (out|off)|drop|not (count|includ|shown|paid|in|list|part)|never|ignor|skipp|cut off|stops? (at|on) Saturday|off[- ]by[- ]one|isn.t|aren.t|doesn.t|don.t|lost|unpaid|\b(6|six) days)|(exclu|miss|leav(es|ing) out|left out|drop|skip|ignor|off[- ]by[- ]one|only (6|six) days|stops? (at|on) Saturday)[^\n]{0,300}Sundays?|2026-11-15[^\n]{0,200}(exclu|miss|not|left|drop|never)|Monday to Saturday|Mon(day)? ?[-–] ?Sat(urday)?\b|\b(6|six)[- ]days?\b[^\n]{0,100}week'}
  - {type: regex, name: row-d15-holidays-2025-only, flags: i, pattern: 'holidays?[^\n]{0,300}(2025|hard-?coded|last year|out of date|only (one|a single) year|next year|every year|each year|2026|2027|stale|expired|old list)|(2025|hard-?coded)[^\n]{0,300}holidays?'}
  - {type: regex, name: row-d16-bank-accounts-on-show, flags: i, pattern: 'bank[^\n]{0,60}(accounts?|details|numbers?)|account numbers?'}
  - {type: regex, name: row-d17-overtime-day-vs-week, flags: i, pattern: 'overtime[^\n]{0,400}(\b40\b[^\n]{0,250}(\b8\b|eight|\bday\b|daily)|(\b8\b|eight|per day|daily|a day|each day|in a day|long day)[^\n]{0,250}(\b40\b|forty|week))|(\b8\b|eight|daily|per day|a day)[^\n]{0,250}(\b40\b|forty|weekly|per week|the week)[^\n]{0,250}overtime|(\b40\b|forty|weekly)[^\n]{0,250}(\b8\b|eight|daily|per day|a day)[^\n]{0,250}overtime'}
  - {type: regex, name: row-d18-unknown-item-valued-zero, flags: i, pattern: '(SWB-12W|switchboard enclosures?)[^\n]{0,300}(\$ ?0\b|zero|nothing|no (cost|price|value)|not (counted|valued|included|in|known|listed|priced)|missing|unknown|skipp|left out|\b276\b|doesn.t (know|have)|isn.t|absent)|(unknown|missing|unlisted|unrecognised|unrecognized)[^\n]{0,120}(cost|price|item|code)s?[^\n]{0,200}(\$ ?0\b|zero|nothing|silently|skipp|ignored|left out)|(no|without a|missing) (cost|price)[^\n]{0,200}(\$ ?0\b|zero|nothing|silently|skipp|left out)'}
  - {type: regex, name: row-d19-stock-goes-negative, flags: i, pattern: '(negative|below (zero|0)|minus|less than (zero|0|nothing)|under zero)[^\n]{0,300}(stock|quantit|qty|van|count|on hand)|(stock|quantit|qty|count|on hand)[^\n]{0,300}(negative|below (zero|0)|minus (numbers?|figures?|quantit)|less than (zero|nothing)|(go|goes|going|drop|drops) (below|under|past) (zero|0))'}
  - {type: regex, name: row-d20-rcd-cost-stale, flags: i, pattern: '^(?=[\s\S]*RCD)(?=[\s\S]*\b48(\.00)?\b)(?=[\s\S]*\b54\.50?\b)'}
  - {type: regex, name: row-d21-timesheet-per-device, flags: i, pattern: '(timesheets?|time sheets?|time entries|(hours|time)[^\n]{0,40}(entered|typed|logged|recorded|saved|stored|booked|put in))[^\n]{0,300}(local ?storage|(in|on|inside) (the|each|that|one|their|whichever|a single|whatever) (own )?(web )?(browser|phone|tablet|device)|per (machine|computer|device|browser|phone)|own (device|computer|machine|browser|phone)|each (phone|device|tablet|browser)|only on (the|that|one)|(don.t|doesn.t|never|not)[^\n]{0,40}(reach|sync|shared?|combine|travel|leave))'}
  - {type: regex, name: row-d22-apprentice-charged-at-98, flags: i, pattern: 'apprentices?[^\n]{0,300}(\b98\b|electrician.?s? rate|full rate|same rate|wrong rate|never used|not used|unused|\b216\b|248\.40|over-?charg|instead of (\$ ?)?62)|(\b98\b|electrician.?s? rate|full rate|unused|never used)[^\n]{0,300}apprentices?|APPRENTICE_RATE'}
  # --- LLM check (not a row) ---
  - type: llm
    name: llm-job-list-copies
    criteria: >
      The reply names at least three different places that each hold their
      own copy of the job list (for example the Jobs spreadsheet, the
      conflicted copy of it, the job board and the timesheet), rather than
      only saying data is duplicated in general.
