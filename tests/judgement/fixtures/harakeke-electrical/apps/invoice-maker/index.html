<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harakeke Electrical - Invoice Maker</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f3; color: #222; }
  header { background: #1f4d3a; color: #fff; padding: .7rem 1rem; }
  header h1 { margin: 0; font-size: 1.25rem; }
  main { max-width: 860px; margin: 1rem auto; padding: 0 1rem; }
  .btn { background: #2f6f54; color: #fff; border: 0; border-radius: 4px; padding: .45rem .9rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; background: #fff; margin: .8rem 0; }
  td, th { border: 1px solid #cfd8d0; padding: .3rem .5rem; text-align: left; }
  td.n, th.n { text-align: right; }
  label { font-weight: bold; }
  select, input, textarea { font-size: 1rem; padding: .25rem; }
  input[type=number] { width: 6rem; }
  .form p { margin: .4rem 0; }
  .totals .big { font-size: 1.2rem; font-weight: bold; }
</style>
</head>
<body>
<header><h1>Invoice Maker</h1></header>
<main>
  <div class="form">
    <p><label for="job">Job number</label> <input id="job" placeholder="HE-0000"></p>
    <p><label for="cust">Customer</label> <input id="cust" size="36"></p>
    <p><label><input type="checkbox" id="callout"> Call-out fee</label></p>
    <p><label for="hours">Electrician hours</label> <input id="hours" type="number" min="0" step="0.25" value="0"></p>
    <p><label for="appr">Apprentice hours</label> <input id="appr" type="number" min="0" step="0.25" value="0"></p>
    <p><label for="after">After-hours hours</label> <input id="after" type="number" min="0" step="0.25" value="0"></p>
    <p><label for="mat">Materials (our cost)</label> <input id="mat" type="number" min="0" step="0.01" value="0"></p>
    <p><label><input type="checkbox" id="trade"> Trade discount (property manager)</label></p>
  </div>
  <table class="totals">
    <thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Line</th></tr></thead>
    <tbody id="lines"></tbody>
  </table>
  <button class="btn" id="save">Save invoice</button>
  <h2>Saved invoices</h2>
  <table><thead><tr><th>Invoice</th><th>Date</th><th>Job</th><th>Customer</th><th class="n">Amount due</th></tr></thead><tbody id="saved"></tbody></table>
</main>
<script>
  // Kiri's invoice maker - rates from the Price List spreadsheet (1 October 2026)
  const RATE = 98;              // electrician, per hour
  const APPRENTICE_RATE = 62;   // apprentice, per hour
  const AFTER_HOURS_RATE = 147; // after hours, per hour
  const CALLOUT = 115;
  const MARKUP = 0.20;          // on materials
  const TRADE_DISCOUNT = 0.10;
  const GST = 0.15;

  const $ = id => document.getElementById(id);
  const num = id => +$(id).value || 0;
  const round2 = n => Math.round(n * 100) / 100;

  function nzd(n) {
    return '$' + n.toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function calc() {
    const lines = [];
    if ($('callout').checked) lines.push(['Call-out fee', 1, CALLOUT]);
    if (num('hours')) lines.push(['Labour - electrician (hours)', num('hours'), RATE]);
    if (num('appr')) lines.push(['Labour - apprentice (hours)', num('appr'), RATE]);
    if (num('after')) lines.push(['Labour - after hours (hours)', num('after'), AFTER_HOURS_RATE]);
    if (num('mat')) lines.push(['Materials', 1, round2(num('mat') * (1 + MARKUP))]);

    let sub = 0;
    let html = '';
    for (const [name, qty, price] of lines) {
      const line = round2(qty * price);
      sub += line;
      html += `<tr><td>${name}</td><td class="n">${qty}</td><td class="n">${nzd(price)}</td><td class="n">${nzd(line)}</td></tr>`;
    }
    sub = round2(sub);
    const gst = round2(sub * GST);
    const total = round2(sub + gst);
    const discount = $('trade').checked ? round2(sub * TRADE_DISCOUNT) : 0;
    const due = round2(total - discount);

    html += `<tr><th colspan="3">Subtotal</th><th class="n">${nzd(sub)}</th></tr>`;
    html += `<tr><td colspan="3">GST 15%</td><td class="n">${nzd(gst)}</td></tr>`;
    html += `<tr><th colspan="3">Total</th><th class="n">${nzd(total)}</th></tr>`;
    if (discount) html += `<tr><td colspan="3">Less trade discount 10%</td><td class="n">-${nzd(discount)}</td></tr>`;
    html += `<tr class="big"><th colspan="3">Amount due</th><th class="n">${nzd(due)}</th></tr>`;
    $('lines').innerHTML = html;
    return due;
  }

  function showSaved() {
    const invoices = JSON.parse(localStorage.getItem('he_invoices') || '[]');
    $('saved').innerHTML = invoices.map(v =>
      `<tr><td>${v.no}</td><td>${v.date}</td><td>${v.job}</td><td>${v.customer}</td><td class="n">${nzd(v.due)}</td></tr>`).join('');
  }

  $('save').onclick = () => {
    const invoices = JSON.parse(localStorage.getItem('he_invoices') || '[]');
    invoices.push({
      no: 'INV-' + (1181 + invoices.length),
      date: today(),
      job: $('job').value,
      customer: $('cust').value,
      due: calc(),
    });
    localStorage.setItem('he_invoices', JSON.stringify(invoices));
    showSaved();
  };

  document.addEventListener('input', calc);
  calc();
  showSaved();
</script>
</body>
</html>
