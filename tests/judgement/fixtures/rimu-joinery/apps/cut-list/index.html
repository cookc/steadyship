<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut List</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f7f4f0; color: #222; }
  header { background: #5a2e1a; color: #fff; padding: .7rem 1rem; }
  header h1 { margin: 0; font-size: 1.25rem; }
  .btn { background: #7a3b1e; color: #fff; border: 0; border-radius: 4px; padding: .45rem .9rem; cursor: pointer; }
  main { max-width: 820px; margin: 1rem auto; padding: 0 1rem; }
  .qty { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .3rem 1rem; margin-bottom: 1rem; }
  .qty input { width: 4rem; font-size: 1rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; margin-bottom: 1rem; }
  td, th { border: 1px solid #d8cfc4; padding: .3rem .5rem; text-align: left; }
  td.n, th.n { text-align: right; }
  tfoot td { font-weight: bold; }
  @media print { .btn, .qty { display: none; } }
</style>
</head>
<body>
<header><h1>Cut List</h1></header>
<main>
  <p>How many of each cabinet is in the job?</p>
  <div class="qty" id="qty"></div>
  <h2>Panels</h2>
  <table>
    <thead><tr><th>Cabinet</th><th>Panel</th><th>Board</th><th class="n">Qty</th><th class="n">L x W (mm)</th></tr></thead>
    <tbody id="panels"></tbody>
  </table>
  <h2>Boards to order</h2>
  <table>
    <thead><tr><th>Board</th><th>Description</th><th class="n">Area (m2)</th><th class="n">Sheets</th><th class="n">Cost</th></tr></thead>
    <tbody id="boards"></tbody>
    <tfoot><tr><td colspan="4">Board cost</td><td class="n" id="cost"></td></tr></tfoot>
  </table>
  <p>Printed <span id="printed"></span></p>
  <button class="btn" onclick="window.print()">Print cut list</button>
</main>
<script>
  // board prices from Materials.csv - Rawiri
  const boards = {
    WMEL: { desc: 'White melamine', cost: 98.5 },
    MDF: { desc: 'Raw MDF (paint-grade doors)', cost: 74 },
    'OAK-VEN': { desc: 'Oak veneer MDF', cost: 275 },
    'PLY-HOOP': { desc: 'Hoop pine ply', cost: 165 },
  };
  const SHEET_M2 = 2.4 * 1.2;
  const YIELD = 0.8; // allow 20% offcuts

  // [panel, board, qty, length, width]
  const cabinets = {
    'Base cabinet 600': [['Side', 'WMEL', 2, 720, 560], ['Bottom', 'WMEL', 1, 568, 560], ['Rail', 'WMEL', 2, 568, 100], ['Shelf', 'WMEL', 1, 566, 520], ['Door', 'MDF', 1, 716, 596]],
    'Base cabinet 900': [['Side', 'WMEL', 2, 720, 560], ['Bottom', 'WMEL', 1, 868, 560], ['Rail', 'WMEL', 2, 868, 100], ['Shelf', 'WMEL', 1, 866, 520], ['Door', 'MDF', 2, 716, 446]],
    'Drawer bank 600': [['Side', 'WMEL', 2, 720, 560], ['Bottom', 'WMEL', 1, 568, 560], ['Rail', 'WMEL', 2, 568, 100], ['Drawer front', 'MDF', 3, 236, 596]],
    'Wall cabinet 600': [['Side', 'WMEL', 2, 720, 300], ['Top/bottom', 'WMEL', 2, 568, 300], ['Shelf', 'WMEL', 1, 566, 280], ['Door', 'MDF', 1, 716, 596]],
    'Tall pantry 600': [['Side', 'WMEL', 2, 2100, 560], ['Top/bottom', 'WMEL', 2, 568, 560], ['Shelf', 'WMEL', 4, 566, 520], ['Door', 'MDF', 2, 1046, 596]],
    'Wardrobe module 900': [['Side', 'WMEL', 2, 2100, 580], ['Top/bottom', 'WMEL', 2, 868, 580], ['Shelf', 'PLY-HOOP', 3, 866, 560]],
    'Vanity 900': [['Side', 'WMEL', 2, 720, 460], ['Bottom', 'WMEL', 1, 868, 460], ['Door', 'OAK-VEN', 2, 716, 446]],
  };

  function nzd(n) {
    return '$' + n.toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function isoDate(d) {
    return d.toISOString().slice(0, 10);
  }

  const qty = document.getElementById('qty');
  for (const name of Object.keys(cabinets)) {
    qty.insertAdjacentHTML('beforeend', `<label><input type="number" min="0" value="0" data-cab="${name}"> ${name}</label>`);
  }

  function draw() {
    const rows = [];
    const area = {};
    document.querySelectorAll('#qty input').forEach(inp => {
      const n = +inp.value || 0;
      if (!n) return;
      for (const [panel, board, q, l, w] of cabinets[inp.dataset.cab]) {
        rows.push(`<tr><td>${inp.dataset.cab}</td><td>${panel}</td><td>${board}</td><td class="n">${q * n}</td><td class="n">${l} x ${w}</td></tr>`);
        area[board] = (area[board] || 0) + q * n * l * w / 1e6;
      }
    });
    document.getElementById('panels').innerHTML = rows.join('');
    let cost = 0;
    document.getElementById('boards').innerHTML = Object.entries(area).map(([code, m2]) => {
      const sheets = Math.ceil(m2 / (SHEET_M2 * YIELD));
      cost += sheets * boards[code].cost;
      return `<tr><td>${code}</td><td>${boards[code].desc}</td><td class="n">${m2.toFixed(2)}</td><td class="n">${sheets}</td><td class="n">${nzd(sheets * boards[code].cost)}</td></tr>`;
    }).join('');
    document.getElementById('cost').textContent = nzd(cost);
    document.getElementById('printed').textContent = isoDate(new Date());
  }
  document.addEventListener('input', draw);
  draw();
</script>
</body>
</html>
